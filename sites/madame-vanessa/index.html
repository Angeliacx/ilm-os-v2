<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#08070c">
    <title>Madame Vanessa</title>
    <meta name="description" content="Madame Vanessa - liens officiels">
    <link rel="canonical" href="https://madamevanessaoff.com">
    <meta property="og:title" content="Madame Vanessa">
    <meta property="og:description" content="Liens officiels">
    <meta property="og:image" content="/assets/cover.jpeg">
    <link rel="stylesheet" href="styles.css">
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="profile" aria-label="Madame Vanessa">
        <div class="cover" aria-hidden="true"></div>
        <div class="content">
          <img class="avatar" src="assets/profile.jpg" alt="Madame Vanessa">
          <p class="eyebrow">Official</p>
          <h1>Madame Vanessa</h1>
          <p class="intro">Un endroit discret pour mes contenus preferes et mes petites updates du moment.</p>
          <div class="links">
            <a href="/go/mym" data-link="MYM">Mon jardin secret 🌹</a>
            <a href="/go/telegram" data-link="Telegram">Telegram des bêtises 🍬</a>
          </div>
          <small>madamevanessaoff.com</small>
        </div>
      </section>
    </main>
    <script>
      document.querySelectorAll("[data-link]").forEach((link) => {
        link.addEventListener("click", () => {
          window.va("event", {
            name: "Vanessa Link Click",
            data: {
              label: link.dataset.link,
              href: link.href,
              source: new URLSearchParams(location.search).get("utm_source") || "direct"
            }
          });
        });
      });
    </script>
  </body>
</html>
